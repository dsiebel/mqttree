when:
  event: [push, pull_request, tag]

steps:
  - name: test
    image: golang:1.27.3-alpine3.24
    commands:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  - name: build
    image: goreleaser/goreleaser:v2.20.1
    depends_on: [test]
    commands:
      - goreleaser build --snapshot --clean

  # Build the Docker image without pushing it. `output: type=local` exports the
  # runtime stage's filesystem into the workspace so the next step can exercise
  # the binary that actually ends up in the image.
  - name: docker-build
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    depends_on: [test]
    settings:
      repo: forgejo.home.dsiebel.de/oss/mqttree
      dockerfile: Dockerfile
      dry_run: true
      output: type=local,dest=.ci-image

  # Smoke test the exported image filesystem: static binary runs, creates its
  # data directory contents and serves the UI and health endpoint.
  - name: docker-test
    image: alpine:3.24.4
    depends_on: [docker-build]
    commands:
      - ./dev/smoke-image.sh .ci-image
      - rm -rf .ci-image

  - name: e2e
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    depends_on: [build]
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends mosquitto >/dev/null
      - printf 'listener 1883\nallow_anonymous true\n' > /tmp/mosquitto.conf
      - mosquitto -c /tmp/mosquitto.conf -d
      - BIN=$(find dist -type f -path '*linux_amd64*' -name mqttree | head -1) && echo "using $BIN"
      - mkdir -p /tmp/mqttree-data
      - MQTTREE_DATA_DIR=/tmp/mqttree-data MQTTREE_SECRET_KEY_FILE=/tmp/mqttree-data/secret.key "$BIN" >/tmp/mqttree.log 2>&1 &
      - for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break; sleep 0.5; done
      - curl -fsS http://127.0.0.1:8080/healthz >/dev/null || { cat /tmp/mqttree.log; exit 1; }
      - cd e2e && npm ci && npx playwright test

  # Woodpecker reports CI_COMMIT_SHA as the annotated tag object. Resolve the
  # peeled commit and bake it into a generated Dockerfile so the published image
  # reports the source revision, not the tag object.
  - name: resolve-commit
    image: alpine:3.24.4
    when:
      - event: tag
    commands:
      - apk add --no-cache git >/dev/null
      - |
        set -eu
        commit=$(git rev-parse "$CI_COMMIT_SHA^{commit}" 2>/dev/null || true)
        if [ -z "$commit" ]; then
          commit=$(git rev-parse "$CI_COMMIT_TAG^{commit}" 2>/dev/null || true)
        fi
        [ -n "$commit" ] || { echo "cannot resolve commit for $CI_COMMIT_TAG" >&2; exit 1; }
        mkdir -p .ci
        sed "s|^ARG COMMIT=.*|ARG COMMIT=$commit|" Dockerfile > .ci/Dockerfile
        grep -q "^ARG COMMIT=$commit$" .ci/Dockerfile
        echo "image revision: $commit"

  # Publish the tested sources as a multi-arch image to the Forgejo package
  # registry, tagged with the release tag that triggered the pipeline.
  - name: publish
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    depends_on: [docker-test, resolve-commit]
    when:
      - event: tag
    settings:
      registry: forgejo.home.dsiebel.de
      repo: forgejo.home.dsiebel.de/oss/mqttree
      dockerfile: .ci/Dockerfile
      platforms: linux/amd64,linux/arm64
      tags: ${CI_COMMIT_TAG}
      provenance: "false"
      # Forgejo resolves the token owner from the password field; the username is
      # ignored, but the plugin skips `docker login` when it is empty.
      username: ${CI_REPO_OWNER}
      password:
        from_secret: forgejo_token
      build_args:
        VERSION: ${CI_COMMIT_TAG}
        DATE: ${CI_PIPELINE_CREATED}

  - name: release
    image: goreleaser/goreleaser:v2.20.1
    depends_on: [build, e2e]
    when:
      - event: tag
    environment:
      GITEA_TOKEN:
        from_secret: forgejo_token
    commands:
      - goreleaser release --clean

  # Trigger the push mirror after the short test gate so it can sync while the
  # build and e2e jobs run. Tags are always mirrored regardless of branch filter;
  # the release step also polls for the exact mirrored commit.
  - name: sync-github
    image: alpine:3.24.4
    depends_on: [test]
    when:
      - event: tag
    environment:
      GITEA_TOKEN:
        from_secret: forgejo_token
    commands:
      - apk add --no-cache curl >/dev/null
      - |
        curl -fsS -X POST -H "Authorization: token $GITEA_TOKEN" \
          "https://forgejo.home.dsiebel.de/api/v1/repos/$CI_REPO/push_mirrors-sync" \
          || echo "push-mirror sync trigger failed; tag poll will verify propagation"

  # Publish the archives and checksums that GoReleaser just built. Reuse its
  # Forgejo release body so both releases have the same generated changelog.
  - name: github-release
    image: alpine:3.24.4
    depends_on: [release, sync-github]
    when:
      - event: tag
    environment:
      GH_TOKEN:
        from_secret: github_token
      GITEA_TOKEN:
        from_secret: forgejo_token
      GH_REPO: dsiebel/mqttree
    commands:
      - |
        set -eu
        apk add --no-cache curl jq github-cli >/dev/null

        # Woodpecker reports an annotated tag's object SHA in CI_COMMIT_SHA, so
        # compare the mirrored tag object, not the peeled commit.
        tries=0
        sha=""
        while [ "$tries" -lt 60 ]; do
          sha=$(gh api "repos/$GH_REPO/git/ref/tags/$CI_COMMIT_TAG" --jq .object.sha 2>/dev/null || true)
          [ "$sha" = "$CI_COMMIT_SHA" ] && break
          tries=$((tries + 1))
          sleep 10
        done
        if [ "$sha" != "$CI_COMMIT_SHA" ]; then
          echo "tag $CI_COMMIT_TAG not on GitHub after 10 minutes (got ${sha:-missing})" >&2
          exit 1
        fi

        curl -fsSL -H "Authorization: token $GITEA_TOKEN" \
          "https://forgejo.home.dsiebel.de/api/v1/repos/$CI_REPO/releases/tags/$CI_COMMIT_TAG" \
          | jq -jr '.body // ""' > release-notes.md

        case "$CI_COMMIT_TAG" in
          *-*) is_prerelease=true ;;
          *) is_prerelease=false ;;
        esac

        if gh release view "$CI_COMMIT_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
          gh release upload "$CI_COMMIT_TAG" dist/*.tar.gz dist/checksums.txt \
            --repo "$GH_REPO" --clobber
          if [ "$is_prerelease" = true ]; then
            gh release edit "$CI_COMMIT_TAG" --repo "$GH_REPO" \
              --notes-file release-notes.md --prerelease
          else
            gh release edit "$CI_COMMIT_TAG" --repo "$GH_REPO" \
              --notes-file release-notes.md
          fi
        elif [ "$is_prerelease" = true ]; then
          gh release create "$CI_COMMIT_TAG" dist/*.tar.gz dist/checksums.txt \
            --repo "$GH_REPO" --title "$CI_COMMIT_TAG" \
            --notes-file release-notes.md --verify-tag --prerelease
        else
          gh release create "$CI_COMMIT_TAG" dist/*.tar.gz dist/checksums.txt \
            --repo "$GH_REPO" --title "$CI_COMMIT_TAG" \
            --notes-file release-notes.md --verify-tag
        fi


  # Copy the already-built multi-arch image to GHCR. No rebuild; digests and
  # platform manifests are preserved by skopeo --all.
  - name: github-image
    image: quay.io/skopeo/stable:v1.24.1
    depends_on: [publish]
    when:
      - event: tag
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      GITEA_TOKEN:
        from_secret: forgejo_token
    commands:
      - |
        skopeo copy --all --preserve-digests \
          --src-creds "$CI_REPO_OWNER:$GITEA_TOKEN" \
          --dest-creds "dsiebel:$GITHUB_TOKEN" \
          "docker://forgejo.home.dsiebel.de/oss/mqttree:$CI_COMMIT_TAG" \
          "docker://ghcr.io/dsiebel/mqttree:$CI_COMMIT_TAG"
